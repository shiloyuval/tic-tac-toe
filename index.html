<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
  </head>
  <body>
    <main>
      <h1>Tic-Tac-Toe</h1>
      <section id="scores" class="scores" aria-label="Scores" aria-live="polite">
        <div class="score"><span class="score-label">Player 1 (X)</span><strong id="score-player1">–</strong></div>
        <div class="score"><span class="score-label">Player 2 (O)</span><strong id="score-player2">–</strong></div>
        <div class="score"><span class="score-label">Draws</span><strong id="score-draws">–</strong></div>
        <p id="scores-note" class="scores-note"></p>
      </section>
      <fieldset class="modes">
        <legend class="visually-hidden">Game mode</legend>
        <label><input type="radio" name="mode" value="two-players" checked /> Two players</label>
        <label><input type="radio" name="mode" value="computer" /> Vs computer</label>
      </fieldset>
      <div id="board" role="group" aria-label="Game board">
        <button class="cell" data-position="0"></button>
        <button class="cell" data-position="1"></button>
        <button class="cell" data-position="2"></button>
        <button class="cell" data-position="3"></button>
        <button class="cell" data-position="4"></button>
        <button class="cell" data-position="5"></button>
        <button class="cell" data-position="6"></button>
        <button class="cell" data-position="7"></button>
        <button class="cell" data-position="8"></button>
      </div>
      <p id="status" aria-live="polite"></p>
      <div class="actions">
        <button id="pause" type="button">Pause</button>
        <button id="new-game" type="button">New game</button>
        <button id="reset-scores" type="button">Reset scores</button>
      </div>
    </main>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
